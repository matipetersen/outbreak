<div id="app">
  <canvas id="map"></canvas>
  <div id="flash"></div>
  <header id="hud" hidden>
    <div class="hud-top"><span id="h-place"></span><span id="h-time"></span></div>
    <div class="bars">
      <div class="meter"><label><span>HP</span><span id="v-hp"></span></label><div class="track"><div class="fill" id="b-hp"></div></div></div>
      <div class="meter"><label><span>Stamina</span></label><div class="track"><div class="fill" id="b-sta"></div></div></div>
      <div class="meter"><label><span>Panic</span></label><div class="track"><div class="fill" id="b-pan"></div></div></div>
      <div class="meter"><label><span>Noise</span></label><div class="track"><div class="fill" id="b-noi"></div></div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="goal" id="goal"></div>
  </header>
  <div id="aim" hidden></div>
  <div id="alert" hidden></div>
  <div id="log" hidden></div>
  <div id="controls" hidden>
    <div id="dpad"></div>
    <div id="actions"></div>
  </div>
  <div id="toast"></div>
  <div id="overlay" hidden><div id="scrim"></div><div id="sheet"><div class="sheet-head"><h2 id="sheet-title"></h2><button class="x" id="sheet-close">Close</button></div><div id="sheet-body"></div></div></div>
  <section class="screen" id="title" hidden></section>
  <section class="screen" id="newgame" hidden></section>
  <section class="screen" id="ending" hidden></section>
</div>
